name: Windows x64

# On-demand exact-source installed-app evidence on hosted Windows Server only.
# No Windows 11, trusted OS input, real services or credentials.
# Images and explicit public-safe candidate export are separate three-day contracts.
on:
  workflow_dispatch:
    inputs:
      release_export:
        description: Export the exact successfully qualified release candidate (not publish)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 build foundation
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
      TESTED_SOURCE: ${{ github.sha }}
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      # Python UTF-8 mode for every helper (text I/O as on macOS/Linux).
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TESTED_SOURCE }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Record exact source, runner and toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -ne $env:TESTED_SOURCE) { throw 'Checked-out source differs from tested source' }
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') { throw 'Windows x64 runner required' }
          $os = Get-CimInstance Win32_OperatingSystem
          "Source: $env:TESTED_SOURCE; run: $env:GITHUB_RUN_ID; image: $env:ImageOS $env:ImageVersion"
          "OS: $($os.Caption) $($os.Version) build $($os.BuildNumber) $env:PROCESSOR_ARCHITECTURE (Windows Server, not Windows 11)"
          node --version; python --version
          rustup toolchain install 1.98.0 --profile minimal
          rustc -vV; cargo --version
          & "$env:ProgramFiles\7-Zip\7z.exe" | Select-Object -First 2
          $webview = Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue
          "WebView2 Runtime: $($webview.pv)"

      - name: Early hosted-session and fresh-install prerequisites
        id: prerequisites
        run: |
          $ErrorActionPreference = 'Stop'
          $session = (Get-Process -Id $PID).SessionId
          "Hosted session: $session; interactive: $([Environment]::UserInteractive) (not renderer success)"
          if ($session -eq 0 -or -not [Environment]::UserInteractive) { throw 'Interactive hosted desktop session unavailable; no machine fallback' }
          $runtime = @(
            'HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          ) | ForEach-Object { Get-ItemProperty $_ -ErrorAction SilentlyContinue } | Where-Object { $_.pv -and $_.pv -ne '0.0.0.0' }
          if (-not $runtime) { throw 'WebView2 prerequisite unavailable; no download or fallback' }
          foreach ($hive in @('HKCU:', 'HKLM:')) {
            foreach ($key in @('SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Garmin Trainer', 'SOFTWARE\codexa\Garmin Trainer')) {
              if (Test-Path "$hive\$key") { throw 'Pre-existing product registration; refusing to adopt installation' }
            }
          }
          foreach ($path in @((Join-Path $env:LOCALAPPDATA 'Garmin Trainer'), (Join-Path $env:APPDATA 'com.codexa.garmin-trainer.desktop'))) {
            if (Test-Path -LiteralPath $path) { throw 'Pre-existing product data/program directory; fresh runner required' }
          }
          'Prerequisites passed; installed renderer, capture and lifecycle remain unproven.'

      - name: Install locked dependencies
        run: npm ci --no-fund

      - name: Release and identity contract tests
        working-directory: scripts/desktop
        run: python -m unittest platform_files_test platform_target_test release_set_test release_test release_cli_test windows_release_test windows_release_export_test redistribution_test windows_app_smoke_test

      - name: Production backend and Windows resources (pinned Node/SQLite probe)
        run: npm run desktop:resources

      - name: Focused Windows JS/TS tests
        run: >-
          npx vitest run tests/desktop-platform.test.ts tests/desktop-runtime.test.ts
          tests/desktop-settings.test.ts tests/desktop-onboarding.test.ts
          tests/tool-runtime-ownership.test.ts tests/persistence-ownership.test.ts
          tests/activity-images.test.ts tests/chatgpt-oauth.test.mjs
          tests/ci-profiles.test.ts tests/windows-app-smoke.test.ts tests/native-smoke-dom.test.tsx
          --test-timeout=60000

      - name: Locked native Windows tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Full ordinary build and unsigned per-user NSIS installer
        id: build
        run: npm run desktop:build

      - name: Non-installing package and final-payload verification
        id: package
        run: |
          $ErrorActionPreference = 'Stop'
          $scratch = Join-Path $env:RUNNER_TEMP ('trainer-windows-' + [guid]::NewGuid())
          New-Item -ItemType Directory $scratch | Out-Null
          # Same npm entry as desktop:build so the bound build context matches.
          npm run release -- package --platform windows-x64 --execute `
            --bundle "$env:GITHUB_WORKSPACE\src-tauri\target\x86_64-pc-windows-msvc\release" --scratch $scratch
          if ($LASTEXITCODE -ne 0) { throw 'package failed' }
          $records = @(Get-ChildItem -Recurse -Filter release-windows-x64.json $scratch)
          if ($records.Count -ne 1) { throw 'Exactly one release record required' }
          $record = $records[0]
          npm run release -- verify --platform windows-x64 `
            --bundle "$env:GITHUB_WORKSPACE\src-tauri\target\x86_64-pc-windows-msvc\release" `
            --scratch $scratch --record $record.FullName
          if ($LASTEXITCODE -ne 0) { throw 'verify failed' }
          Get-Content $record.FullName
          "record=$($record.FullName)" >> $env:GITHUB_OUTPUT

      - name: Synthetic packaged-backend smoke (no window, installer or services)
        id: backend
        run: python scripts/desktop/windows_backend_smoke.py --resources src-tauri/target/x86_64-pc-windows-msvc/release/resources

      - name: Installed ordinary app render, restart and preserving uninstall
        id: installed
        env:
          WINDOWS_RELEASE_RECORD: ${{ steps.package.outputs.record }}
        run: |
          $ErrorActionPreference = 'Stop'
          $scratch = Join-Path $env:RUNNER_TEMP ('trainer-installed-' + [guid]::NewGuid())
          $evidence = Join-Path $env:RUNNER_TEMP ('trainer-masked-evidence-' + [guid]::NewGuid())
          npm run smoke:windows -- --producer "$env:GITHUB_WORKSPACE\src-tauri\target\x86_64-pc-windows-msvc\release" `
            --record "$env:WINDOWS_RELEASE_RECORD" --scratch $scratch --evidence $evidence
          if ($LASTEXITCODE -ne 0) { throw 'Installed scenario failed; no artifact eligible' }
          "evidence=$evidence" >> $env:GITHUB_OUTPUT

      - name: Upload only validated synthetic masked evidence
        id: images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installed-render-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.TESTED_SOURCE }}
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: false
          path: |
            ${{ steps.installed.outputs.evidence }}/trainer-wide.png
            ${{ steps.installed.outputs.evidence }}/trainer-narrow.png
            ${{ steps.installed.outputs.evidence }}/sync-wide.png
            ${{ steps.installed.outputs.evidence }}/sync-narrow.png
            ${{ steps.installed.outputs.evidence }}/profile-wide.png
            ${{ steps.installed.outputs.evidence }}/profile-narrow.png
            ${{ steps.installed.outputs.evidence }}/manifest.json

      - name: Select exact qualified public-safe Windows release files
        id: export
        if: ${{ inputs.release_export }}
        env:
          WINDOWS_RELEASE_RECORD: ${{ steps.package.outputs.record }}
          WINDOWS_IMAGES: ${{ steps.installed.outputs.evidence }}
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = Join-Path $env:RUNNER_TEMP ('trainer-release-export-' + [guid]::NewGuid())
          python scripts/desktop/windows_release_export.py export --record $env:WINDOWS_RELEASE_RECORD `
            --images $env:WINDOWS_IMAGES --directory $directory
          if ($LASTEXITCODE -ne 0) { throw 'Exact candidate export refused' }
          $version = (Get-Content $env:WINDOWS_RELEASE_RECORD | ConvertFrom-Json).version
          "directory=$directory" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload only the selected Windows release triple and receipt
        id: binaries
        if: ${{ inputs.release_export }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.TESTED_SOURCE }}
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: false
          path: |
            ${{ steps.export.outputs.directory }}/Garmin-Trainer-${{ steps.export.outputs.version }}-windows-x64-setup.exe
            ${{ steps.export.outputs.directory }}/Garmin-Trainer-${{ steps.export.outputs.version }}-windows-x64-setup.exe.sha256
            ${{ steps.export.outputs.directory }}/release-windows-x64.json
            ${{ steps.export.outputs.directory }}/windows-release-export.json

      - name: Record actual per-stage coverage and outcome
        if: ${{ always() }}
        env:
          JOB_RESULT: ${{ job.status }}
          PREREQUISITES_RESULT: ${{ steps.prerequisites.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          PACKAGE_RESULT: ${{ steps.package.outcome }}
          BACKEND_RESULT: ${{ steps.backend.outcome }}
          INSTALLED_RESULT: ${{ steps.installed.outcome }}
          IMAGES_RESULT: ${{ steps.images.outcome }}
          EXPORT_RESULT: ${{ steps.binaries.outcome }}
        run: |
          $summary = @"
          ### On-demand Windows x64: $env:JOB_RESULT

          Source: ``$env:TESTED_SOURCE``; run/attempt $env:GITHUB_RUN_ID/$env:GITHUB_RUN_ATTEMPT on hosted Windows Server ($env:ImageOS $env:ImageVersion), x64.
          Prerequisites: $env:PREREQUISITES_RESULT; build: $env:BUILD_RESULT; package/verify: $env:PACKAGE_RESULT; backend: $env:BACKEND_RESULT; installed scenario: $env:INSTALLED_RESULT; eligible image upload: $env:IMAGES_RESULT.
          Only a successful installed scenario proves install, hydrated Trainer/Sync/Profile navigation, synthetic Goals save/restart/readback, six own-WebView2 masked captures with restoration, owned settlement and data-preserving uninstall. Pending/skipped stages are not covered. Downloaded images still require individual inspection; file creation/upload is not visual approval.
          Image artifact (three days): only six validated synthetic masked PNGs and one sanitized manifest. Separate explicit release export: $env:EXPORT_RESULT (exact qualified installer, checksum, Windows record and closed receipt only). No settings, DBs, capabilities, tokens, raw captures or logs. Job-local data expires with the runner. NSIS manufacturer install-location metadata is retained; uninstall registration/program/shortcuts are settled.
          Not qualified: Windows 11, upgrade/downgrade, native menus/focus/trusted input/window chrome, onboarding, real providers/Garmin, signing/SmartScreen. No release/deploy. Windows remains non-required; Ubuntu Validate/macOS policy is unchanged.
          "@
          $summary >> $env:GITHUB_STEP_SUMMARY

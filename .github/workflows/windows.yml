name: Windows x64

# Exact-source Windows x64 build foundation evidence on a hosted Windows Server
# runner. This is not Windows 11 qualification: no installer execution, native
# window/input, real services, private data, credentials or uploads.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 build foundation
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
      TESTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      # Python UTF-8 mode for every helper (text I/O as on macOS/Linux).
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TESTED_SOURCE }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Record exact source, runner and toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -ne $env:TESTED_SOURCE) { throw 'Checked-out source differs from tested source' }
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') { throw 'Windows x64 runner required' }
          $os = Get-CimInstance Win32_OperatingSystem
          "Source: $env:TESTED_SOURCE; run: $env:GITHUB_RUN_ID; image: $env:ImageOS $env:ImageVersion"
          "OS: $($os.Caption) $($os.Version) build $($os.BuildNumber) $env:PROCESSOR_ARCHITECTURE (Windows Server, not Windows 11)"
          node --version; python --version
          rustup toolchain install 1.98.0 --profile minimal
          rustc -vV; cargo --version
          & "$env:ProgramFiles\7-Zip\7z.exe" | Select-Object -First 2
          $webview = Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue
          "WebView2 Runtime: $($webview.pv)"

      - name: Install locked dependencies
        run: npm ci --no-fund

      - name: Release and identity contract tests
        working-directory: scripts/desktop
        run: python -m unittest platform_files_test platform_target_test release_set_test release_test windows_release_test redistribution_test

      - name: Production backend and Windows resources (pinned Node/SQLite probe)
        run: npm run desktop:resources

      - name: Locked native Windows tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Focused Windows JS/TS tests
        run: >-
          npx vitest run tests/desktop-platform.test.ts tests/desktop-runtime.test.ts
          tests/desktop-settings.test.ts tests/desktop-onboarding.test.ts
          tests/tool-runtime-ownership.test.ts tests/persistence-ownership.test.ts
          tests/activity-images.test.ts tests/chatgpt-oauth.test.mjs

      - name: Full ordinary build and unsigned per-user NSIS installer
        run: npm run desktop:build

      - name: Non-installing package and final-payload verification
        run: |
          $ErrorActionPreference = 'Stop'
          $scratch = Join-Path $env:RUNNER_TEMP ('trainer-windows-' + [guid]::NewGuid())
          New-Item -ItemType Directory $scratch | Out-Null
          python scripts/desktop/release.py package --platform windows-x64 --execute `
            --bundle "$env:GITHUB_WORKSPACE\src-tauri\target\x86_64-pc-windows-msvc\release" --scratch $scratch
          $record = Get-ChildItem -Recurse -Filter release-windows-x64.json $scratch | Select-Object -First 1
          python scripts/desktop/release.py verify --platform windows-x64 `
            --bundle "$env:GITHUB_WORKSPACE\src-tauri\target\x86_64-pc-windows-msvc\release" `
            --scratch $scratch --record $record.FullName
          Get-Content $record.FullName
          "TRAINER_RECORD=$($record.FullName)" >> $env:GITHUB_ENV

      - name: Synthetic packaged-backend smoke (no window, installer or services)
        run: python scripts/desktop/windows_backend_smoke.py --resources src-tauri/target/x86_64-pc-windows-msvc/release/resources

      - name: Record actual coverage and outcome (no uploads)
        if: ${{ always() }}
        env:
          JOB_RESULT: ${{ job.status }}
        run: |
          $summary = @"
          ### Windows x64 build foundation: $env:JOB_RESULT

          Source: ``$env:TESTED_SOURCE`` on hosted Windows Server ($env:ImageOS $env:ImageVersion), x64.
          Covered when successful: focused JS/TS and release/identity tests, pinned Windows Node/SQLite probe, locked native tests (private ACL/handle/rename/lock, Job Object process trees), full ordinary build, unsigned per-user NSIS installer, non-installing payload/notices/identity verification, synthetic packaged-backend smoke.
          Not covered: Windows 11, installer execution, native window/WebView2 UI, trusted input, real providers/Garmin, signing/SmartScreen. No artifacts uploaded; job-local state expires with the runner.
          "@
          $summary >> $env:GITHUB_STEP_SUMMARY

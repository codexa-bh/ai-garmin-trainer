[package]
name = "garmin-trainer-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-single-instance = "=2.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
ctrlc = { version = "3", features = ["termination"] }

# Preserve proc-macro metadata on the supported Homebrew Rust/macOS toolchain.
# Release stripping causes E0463; a controlled no-strip build restores loading.
[profile.release]
strip = "none"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

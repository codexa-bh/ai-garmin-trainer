[package]
name = "garmin-trainer-desktop"
version = "0.1.4"
edition = "2021"
license = "MIT"
publish = false

[build-dependencies]
serde_json = "1"
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-single-instance = "=2.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
ctrlc = { version = "3", features = ["termination"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
block2 = "=0.6.2"

# Windows private-state, owned-process-tree and URL-opening mechanisms. Already in
# the locked Tauri closure; features select only the reviewed OS APIs.
[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_System_Com_StructuredStorage"] }
windows-sys = { version = "=0.61.2", features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# Preserve proc-macro metadata on the supported Homebrew Rust/macOS toolchain.
# Release stripping causes E0463; a controlled no-strip build restores loading.
[profile.release]
strip = "none"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Launch-only isolated denial instrumentation; never enabled by desktop:build.
release-probe = []
